replicaCount: 1

image:
  repository: adityahere/severus-ai
  tag: v1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8501

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: severus-ai.local
      paths:
        - path: /
          pathType: Prefix

env:
  OLLAMA_BASE_URL: "http://host.k3d.internal:11434"

# Performance Testing Configuration
performanceTest:
  # Enable/disable performance evaluation stage in CI/CD
  enabled: true
  
  # Target URLs to test (can specify multiple)
  targets:
    - "http://severus-ai.local"
  
  # Load parameters
  totalRequests: 5000        # Total requests
  concurrency: 5000        # SEND ALL AT ONCE
  runs: 1                   # Single massive burst
  sleepBetweenRuns: 2       # Small sleep
  
  # Pod validation
  podLabels:
    - "app.kubernetes.io/name=severus-ai"
  
  # Optional: Resource thresholds for validation
  thresholds:
    maxCpuMillicores: 1000  # Maximum acceptable CPU usage (millicores)
    maxMemoryMiB: 512       # Maximum acceptable memory usage (MiB)

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 20

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus
