apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "severus-ai.fullname" . }}-tls
spec:
  secretName: {{ include "severus-ai.fullname" . }}-tls-secret
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  subject:
    organizations:
      - severus-ai
  commonName: {{ include "severus-ai.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
    - client auth
  issuerRef:
    name: local-ca-issuer
    kind: ClusterIssuer
